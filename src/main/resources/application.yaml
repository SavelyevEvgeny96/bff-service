spring:
  application:
    name: bff-payment-service
  profiles:
    active: ${ENVIRONMENT:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  liquibase:
    change-log: db.changelog/db.changelog-master.yaml
    enabled: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  output:
    ansi:
      enabled: ALWAYS
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  use-forward-headers: true
  forward-headers-strategy: framework
  main.allow-bean-definition-overriding: true
  servlet:
    encoding:
      charset: UTF-8
      force: true     # навязывать UTF-8 и для ответа, и для запроса
      enabled: true

app:
  info:
    application_name: ${PROJECT_NAME:BFF payment service}
    version: ${PROJECT_VERSION:1.0.0}
    description: ${PROJECT_DESCRIPTION:BFF payment service}
    artifact_Id: ${PROJECT_ARTIFACTID:bff-payment-service}
    group_Id: ${PROJECT_GROUPID:ru.sogaz.site}
    app_profile: ${ENVIRONMENT:local}
    java-version: ${JAVA_VERSION:21}

api:
  ordering:
    basePath: ${ORDERING_BASE_PATH:https://s00-0000-k835.sogaz.ru/test/invoice-service}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${HOSTNAME:localhost}
    export:
      prometheus:
        enabled: true

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVICE_PORT:8091}
  health:
    livenessState:
      enable: true
    readinessState:
      enable: true

logging:
  proxy:
    log-headers: ${LOGGING_PROXY_LOG_HEADERS:TRUE}
  level:
    org.springframework.jdbc: ${LOG_JDBC_LEVEL:INFO}
    org.springframework.transaction: ${LOG_TRANSACTION_LEVEL:INFO}

logstash:
  host: ${LOG_SERVER_HOST:}
  port: ${LOG_SERVER_PORT:12201}
  level: ${LOG_LEVEL:INFO}
  level_local: ${LOG_LEVEL_LOCAL:INFO}
