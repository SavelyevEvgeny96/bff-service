automation:
  dry-run: false
  submit-enabled: false
  randomize-scenario-order: false
  random-seed: 123456
  browser:
    headless: false
    profile-dir: build/browser-profile
  limits:
    max-run-duration: PT10M
    max-navigation-count: 30
    max-action-count: 100
  artifacts:
    directory: build/test-results/browser
  processes:
    cleanup-on-exit: true
    allowed:
      notepad:
        executable: "C:\\Windows\\System32\\notepad.exe"
        args: []
  allowed-hosts:
    - domain: example.com
      include-subdomains: true
  test-data:
    search-text: "Playwright Kotlin Test"
    first-name: "Test"
    last-name: "User"
    city: "Amsterdam"
  scenarios:
    open-demo:
      enabled: true
      actions:
        - { type: OPEN_PAGE, url: "https://example.com" }
        - { type: ASSERT_TEXT, selector: { type: CSS, value: "h1" }, value: "Example Domain" }
    navigation-demo:
      enabled: false
      actions:
        - { type: OPEN_PAGE, url: "https://example.com" }
        - { type: CLICK, selector: { type: CSS, value: "a" } }
        - { type: BACK }
    form-demo:
      enabled: false
      actions:
        - { type: OPEN_PAGE, url: "https://example.com/form" }
        - { type: FILL, selector: { type: TEST_ID, value: "first-name" }, data-key: "first-name" }
        - { type: CHECK, selector: { type: LABEL, value: "Accept terms" } }
        - { type: SELECT, selector: { type: CSS, value: "#city" }, data-key: "city" }
    multipage-demo:
      enabled: true
      actions:
        - { type: OPEN_PAGE, url: "https://example.com" }
        - { type: OPEN_TAB, url: "https://example.com/?tab=2" }
        - { type: CLOSE_TAB }
